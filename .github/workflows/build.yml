name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install GNOME build tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes --no-install-recommends
          gnome-shell libglib2.0-bin

      - name: Run checks
        run: make check

      - name: Build extension archive
        run: make bundle

      - name: Upload extension archive
        uses: actions/upload-artifact@v7
        with:
          name: toodoo-gnome-extension
          path: dist/toodoo@mendrik.github.io.shell-extension.zip
          if-no-files-found: error
